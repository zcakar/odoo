<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Draw.io SVG Plugin</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #drawio-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        #error {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #c00;
            padding: 20px;
        }
        #error button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="scripts/plugin.js"></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Draw.io editor...</div>
    </div>
    <div id="error">
        <p>Failed to load Draw.io editor.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
    <iframe id="drawio-frame"
            allow="clipboard-read; clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals">
    </iframe>
</body>
</html>
