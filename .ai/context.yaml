# ----------------------------------------------------------------------------
# DEVELOPMENT RULES & CONVENTIONS
# ----------------------------------------------------------------------------
development:
  standards:
    code_language: "English"
    comments: "English"
    documentation: "English"

  odoo_conventions:
    module_structure: "Standard Odoo addon structure"
    naming: "Follow Odoo naming conventions"
    manifest: "Required __manifest__.py"

  architecture:
    approach: "Modular addons"
    customization: "No direct core modification"
    enterprise: "NOT ALLOWED - Community Edition only"

  git_workflow:
    commit_messages: "Clear, descriptive English"
    branch_strategy: "Feature branches from 19.0"

  security:
    passwords: "Never commit production credentials"
    config_files: "Use .example templates"
    env_variables: "Prefer environment-specific configs"

# ----------------------------------------------------------------------------
# TECHNICAL CONSTRAINTS
# ----------------------------------------------------------------------------
constraints:
  odoo_version: "19.0 Community"
  python_version: ">=3.10"
  postgresql_version: ">=12"

  forbidden:
    - "Odoo Enterprise modules"
    - "Direct core file modifications"
    - "Hardcoded credentials in version control"

  required:
    - "All custom modules must be in custom_addons/"
    - "Manifest file for each module"
    - "English documentation"

# ----------------------------------------------------------------------------
# DEPLOYMENT & OPERATIONS
# ----------------------------------------------------------------------------
deployment:
  method: "systemd service"
  service_name: "odoo.service"
  user: "odoo"  # Recommended production user

  startup:
    command: "./odoo-bin -c odoo.conf"
    config: "odoo.conf or odoo.conf.smb"

  maintenance:
    updates: "Via git pull from upstream"
    backups: "PostgreSQL dumps + filestore"
    monitoring: "odoo.log"

# ----------------------------------------------------------------------------
# COMMON OPERATIONS
# ----------------------------------------------------------------------------
operations:
  start_odoo:
    dev: "python3 odoo-bin -c odoo.conf"
    production: "systemctl start odoo"

  install_module:
    command: "python3 odoo-bin -c odoo.conf -i module_name"
    update: "python3 odoo-bin -c odoo.conf -u module_name"

  database:
    create: "python3 odoo-bin -c odoo.conf -d db_name"
    backup: "pg_dump odoo_smb > backup.sql"
    restore: "psql odoo_smb < backup.sql"

  development:
    debug_mode: "Add --dev=all flag"
    shell: "python3 odoo-bin shell -c odoo.conf"

# ----------------------------------------------------------------------------
# KNOWN ISSUES & DECISIONS
# ----------------------------------------------------------------------------
decisions:
  database_naming:
    decision: "Use odoo_smb (underscore) not odoo-smb (hyphen)"
    reason: "PostgreSQL compatibility and convention"
    commit: "59f783df2ff"

  onlyoffice_integration:
    decision: "Custom module in custom_addons/ with manual Odoo 19.0 patches"
    reason: "Official module targets Odoo 18.0, required compatibility patches for 19.0"
    commit: "e2afe488036"

    key_decisions:
      - "Use official OnlyOffice repo branch 18.0 as base"
      - "Apply manual patches for Odoo 19.0 API changes"
      - "Deploy OnlyOffice Document Server via Docker"
      - "Use JWT authentication (enabled by default in OnlyOffice v7.2+)"
      - "Change http_interface to 0.0.0.0 for Docker container communication"

    why_docker:
      reason: "Easiest deployment method with built-in updates"
      alternatives: "Standalone installation (more complex), SaaS version (paid)"

    why_patches_needed:
      - "Odoo 19.0 removed 'inline' target for ir.actions.act_window"
      - "Odoo 19.0 changed mail attachment card DOM structure"
      - "Odoo 19.0 replaced validate_access() with _can_return_content()"

  interface_binding:
    development: "0.0.0.0 (all interfaces)"
    production: "0.0.0.0 (if behind Nginx reverse proxy)"
    critical_note: "Must be 0.0.0.0 for OnlyOffice Docker container to callback to Odoo"
    security: "Always use Nginx reverse proxy with SSL in production"

  network_architecture:
    decision: "Bidirectional communication: Odoo ↔ OnlyOffice"
    odoo_to_onlyoffice: "Editor initialization, file conversion"
    onlyoffice_to_odoo: "File downloads, save callbacks"
    localhost_issue: "localhost from Docker container != localhost from host system"
    solution: "Use host IP (192.168.x.x) in development, domain in production"

# ----------------------------------------------------------------------------
# DEPENDENCIES & PACKAGES
# ----------------------------------------------------------------------------
dependencies:
  system:
    - "postgresql-16"
    - "python3.10"
    - "python3-pip"
    - "python3-venv"
    - "docker (for OnlyOffice Document Server)"
    - "nginx (production)"
    - "certbot (SSL)"

  python:
    requirements_file: "requirements.txt"
    virtual_env: ".venv"

    key_packages:
      - "pyjwt (OnlyOffice)"
      - "psycopg2"
      - "Babel"
      - "Pillow"
      # See requirements.txt for full list

# ----------------------------------------------------------------------------
# TROUBLESHOOTING GUIDE
# ----------------------------------------------------------------------------
troubleshooting:
  module_not_loading:
    check:
      - "Module in correct addons path"
      - "__manifest__.py exists and valid"
      - "Dependencies installed"
      - "Module installed: python3 odoo-bin -i module_name"

  database_connection_failed:
    check:
      - "PostgreSQL running: systemctl status postgresql"
      - "Port 5433 accessible"
      - "Database exists: psql -l"
      - "Credentials in odoo.conf correct"

  permission_denied:
    check:
      - "File ownership: chown -R odoo:odoo /path"
      - "Directory permissions: 755 for dirs, 644 for files"
      - "PostgreSQL user privileges"

# ----------------------------------------------------------------------------
# AI ASSISTANT GUIDELINES
# ----------------------------------------------------------------------------
ai_guidelines:
  context_loading:
    - "ALWAYS read this file at the start of new sessions"
    - "Reference specific sections when relevant"
    - "Ask for clarification if context seems outdated"

  code_generation:
    - "Follow Odoo addon structure strictly"
    - "Use English for all code and comments"
    - "No Enterprise module dependencies"
    - "Test compatibility with Odoo 19.0"

  file_operations:
    - "Custom modules ONLY in custom_addons/"
    - "Never modify odoo/ core files directly"
    - "Use odoo.conf for configuration"

  security:
    - "Never expose passwords in responses"
    - "Remind to use environment-specific configs"
    - "Flag any security concerns immediately"

  session_continuity:
    when_starting_new_chat:
      - "Load context from .ai/context.yaml"
      - "Understand project structure"
      - "Know current state and decisions"

    when_unsure:
      - "Check this context file first"
      - "Verify against git history"
      - "Ask user for current status if needed"

# ----------------------------------------------------------------------------
# QUICK REFERENCE
# ----------------------------------------------------------------------------
quick_reference:
  start_development:
    - "cd /home/embed/Dev/ODOO/odoo"
    - "source .venv/bin/activate"
    - "python3 odoo-bin -c odoo.conf --dev=all"

  access_odoo:
    url: "http://localhost:8069"
    database: "odoo_smb"
    admin: "Configured in Settings > Users"

  add_new_module:
    - "Create in custom_addons/"
    - "Follow Odoo structure"
    - "Update addons_path if needed"
    - "Install: python3 odoo-bin -i module_name -c odoo.conf"

  update_existing_module:
    - "Make code changes"
    - "Update: python3 odoo-bin -u module_name -c odoo.conf"
    - "Or update from Odoo UI: Apps > Module > Upgrade"

  onlyoffice_setup:
    docker_commands:
      start_container: "docker start onlyoffice-documentserver"
      stop_container: "docker stop onlyoffice-documentserver"
      check_health: "curl http://localhost:8080/healthcheck"
      get_jwt_secret: "docker exec onlyoffice-documentserver cat /etc/onlyoffice/documentserver/local.json | grep -A 2 '\"secret\"'"
      view_logs: "docker logs onlyoffice-documentserver | tail -50"

    odoo_commands:
