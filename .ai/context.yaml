# ============================================================================
# SODOO PROJECT CONTEXT - AI Memory File
# ============================================================================
# This file provides persistent context for AI assistants (Claude, Codex, etc.)
# across different chat sessions. Always reference this file at the start of
# new conversations to maintain project continuity.
#
# Last Updated: 2025-12-25
# ============================================================================

project:
  name: "SODOO - Open Source ERP System"
  type: "ERP System (Odoo 19.0 based)"
  version: "19.0"
  edition: "Community"
  status: "Active Development"

  workspace:
    primary_repo: "https://github.com/zzafercakar/sodoo"
    description: "Complete SODOO workspace"
    structure: "Monorepo with odoo as submodule"
    deployment_source: "This is the PRIMARY repo for all deployments"

# ----------------------------------------------------------------------------
# ENVIRONMENT & INFRASTRUCTURE
# ----------------------------------------------------------------------------
environment:
  os:
    distribution: "Ubuntu"
    version: "22.04.5 LTS"
    codename: "Jammy Jellyfish"

  runtime:
    python:
      version: "3.10.12"
      path: "/usr/bin/python3"
      virtual_env: "venv"

  database:
    engine: "PostgreSQL"
    version: "16"
    connection:
      host: "/tmp"  # Unix socket
      port: 5433
      user: "odoo"
      name: "sodoo_smb"
      password: "CONFIGURED_IN_ODOO_CONF"  # See odoo.conf (not in version control)

  web_server:
    type: "Odoo Built-in"
    port: 8069
    interface: "0.0.0.0"  # Production uses 127.0.0.1
    reverse_proxy: "Nginx (recommended)"
    ssl: "Let's Encrypt (production)"

# ----------------------------------------------------------------------------
# PROJECT STRUCTURE
# ----------------------------------------------------------------------------
paths:
  development:
    workspace: "/home/embed/Dev/SODOO"
    logos: "/home/embed/Dev/SODOO/logos"

  production:
    workspace: "/opt/sodoo"
    logos: "/opt/sodoo/logos"
    config: "/etc/odoo/odoo.conf"
    venv: "/opt/sodoo/venv"

  core:
    odoo: "odoo/"
    binary: "odoo/odoo-bin"
    core_addons: "odoo/addons/"

  custom:
    addons: "custom_addons/"
    modules:
      - "onlyoffice_odoo"  # Office document editor integration (SODOOC)

  logos:
    directory: "logos/"
    main_logo: "logos/sodoo-logo.svg"
    favicon_svg: "logos/sodoo-logo-favicon.svg"
    favicon_ico: "logos/sodoo-favicon.ico"
    sodooc_logo: "logos/sodooc-logo.svg"
    sodooc_favicon: "logos/sodooc-favicon.ico"

  config:
    main: "odoo.conf"
    smb: "odoo.conf.smb"  # SMB-specific configuration
    example: "odoo/odoo.conf.example"

  logs:
    main: "odoo.log"

  data:
    postgresql: "pgdata/"

# ----------------------------------------------------------------------------
# CONFIGURATION
# ----------------------------------------------------------------------------
configuration:
  addons_path:
    - "odoo/addons"
    - "custom_addons"

  interfaces:
    development: "0.0.0.0:8069"  # All interfaces
    production: "127.0.0.1:8069"  # Localhost only (behind Nginx)

  logging:
    destination: "odoo.log"
    level: "info"  # Default

# ----------------------------------------------------------------------------
# GIT & VERSION CONTROL
# ----------------------------------------------------------------------------
git:
  current_branch: "19.0"
  default_branch: "19.0"

  remotes:
    origin:
      url: "https://github.com/zzafercakar/odoo"
      purpose: "SODOO fork - Odoo core with SODOOC integration"
    upstream:
      url: "https://github.com/odoo/odoo.git"
      purpose: "Official Odoo repository"
    workspace:
      url: "https://github.com/zzafercakar/sodoo"
      purpose: "Complete SODOO workspace (includes odoo as submodule)"

  recent_commits:
    - hash: "e2afe488036"
      message: "Add OnlyOffice module with Odoo 19.0 compatibility fixes"
    - hash: "59f783df2ff"
      message: "Use odoo_smb database name"
    - hash: "6de4495a1f8"
      message: "Update odoo.conf.smb for odoo-smb db"

# ----------------------------------------------------------------------------
# CUSTOM MODULES
# ----------------------------------------------------------------------------
custom_modules:
  onlyoffice_odoo:
    name: "ONLYOFFICE"
    version: "5.3.11"
    category: "Productivity"
    description: "Edit and collaborate on office files within Odoo Documents"
    author: "ONLYOFFICE"
    license: "LGPL-3"
    source: "https://github.com/ONLYOFFICE/onlyoffice_odoo"
    branch_used: "18.0"  # No 19.0 branch available, patched manually

    dependencies:
      odoo_modules:
        - "base"
        - "mail"
      python_packages:
        - "pyjwt"  # Install: pip install pyjwt

    features:
      - "Text documents editing (.docx, .doc, .odt)"
      - "Spreadsheet editing (.xlsx, .xls, .ods)"
      - "Presentation editing (.pptx, .ppt, .odp)"
      - "Real-time co-editing (Fast & Strict modes)"
      - "Track Changes"
      - "Comments & built-in chat"
      - "Version history"
      - "Direct editing from Odoo attachments"

    compatibility:
      odoo_version: "19.0"
      original_target: "18.0"
      status: "Patched for Odoo 19.0 compatibility"

      patches_required:
        - file: "views/res_config_settings_views.xml"
          line: 117
          change: "target='inline' → target='current'"
          reason: "Odoo 19.0 removed 'inline' target support for ir.actions.act_window"

        - file: "views/attachment_card_onlyoffice.xml"
          xpath_old: "//div[hasclass('o-mail-AttachmentCard-aside')]"
          xpath_new: "//div[hasclass('o-mail-AttachmentButtons')]"
          reason: "Odoo 19.0 changed mail attachment card structure"

        - file: "controllers/controllers.py"
          line: 179
          method_old: "attachment.validate_access(access_token)"
          method_new: "attachment._can_return_content(access_token=access_token)"
          reason: "Odoo 19.0 replaced validate_access() with _can_return_content()"

    onlyoffice_document_server:
      component: "OnlyOffice Document Server"
      version: "9.2.0"
      deployment: "Docker container"

      docker:
        image: "onlyoffice/documentserver"
        container_name: "onlyoffice-documentserver"
        ports:
          host: 8080
          container: 80
        command: |
          docker run -i -t -d -p 8080:80 --restart=always \
            --name onlyoffice-documentserver \
            onlyoffice/documentserver

        management:
          start: "docker start onlyoffice-documentserver"
          stop: "docker stop onlyoffice-documentserver"
          restart: "docker restart onlyoffice-documentserver"
          logs: "docker logs onlyoffice-documentserver"
          shell: "docker exec -it onlyoffice-documentserver /bin/bash"

      jwt_authentication:
        enabled: true  # Enabled by default since v7.2
        secret_location: "/etc/onlyoffice/documentserver/local.json"
        get_secret: |
          docker exec onlyoffice-documentserver cat /etc/onlyoffice/documentserver/local.json | grep -A 2 '"secret"'
        secret_example: "0aSIXJAuvK63VGej1QZQsTmJpMRnVIXd"
        header: "Authorization"

      healthcheck:
        endpoint: "/healthcheck"
        expected_response: "true"
        test_command: "curl http://localhost:8080/healthcheck"

    odoo_configuration:
      settings_location: "Settings → ONLYOFFICE"

      required_fields:
        doc_server_public_url:
          label: "ONLYOFFICE Docs address"
          development_value: "http://192.168.181.130:8080/"
          production_value: "https://onlyoffice.yourdomain.com/"
          notes: "OnlyOffice Document Server URL (must be accessible from Odoo)"

        doc_server_secret:
          label: "ONLYOFFICE Docs secret key"
          value: "GET_FROM_DOCKER_CONTAINER"
          notes: "JWT secret from OnlyOffice container"

        jwt_header:
          label: "JWT Header"
          value: "Authorization"
          notes: "HTTP header for JWT token"

        doc_server_odoo_url:
          label: "ONLYOFFICE Docs address for internal requests from the server"
          development_value: "http://192.168.181.130:8069/"
          production_value: "https://yourodoo.com/"
          notes: "Odoo's URL for OnlyOffice callbacks (file downloads, saves)"

        doc_server_inner_url:
          label: "Server address for internal requests from ONLYOFFICE Docs"
          value: "LEAVE_EMPTY_OR_SAME_AS_PUBLIC_URL"
          notes: "Optional: Alternative OnlyOffice URL for Odoo's internal requests"

    network_requirements:
      odoo_to_onlyoffice:
        direction: "Odoo → OnlyOffice Document Server"
        protocol: "HTTP/HTTPS"
        purpose: "Editor initialization, file conversion requests"
        url_used: "doc_server_public_url"

      onlyoffice_to_odoo:
        direction: "OnlyOffice Document Server → Odoo"
        protocol: "HTTP/HTTPS"
        purpose: "File downloads, save callbacks"
        url_used: "doc_server_odoo_url"

      critical_config:
        http_interface:
          parameter: "http_interface in odoo.conf"
          development: "0.0.0.0"  # Required for Docker container access
          production: "0.0.0.0 (if behind Nginx) or 127.0.0.1 (if OnlyOffice on same host)"
          warning: "127.0.0.1 blocks Docker container from accessing Odoo!"

    installation_steps:
      development:
        - step: "Clone OnlyOffice module"
          command: "git clone --depth 1 --branch 18.0 https://github.com/ONLYOFFICE/onlyoffice_odoo.git /tmp/onlyoffice_odoo"

        - step: "Copy to custom_addons"
          command: "cp -r /tmp/onlyoffice_odoo/onlyoffice_odoo custom_addons/"

        - step: "Install Python dependencies"
          command: "pip install pyjwt"

        - step: "Update odoo.conf"
          change: "addons_path = odoo/addons,custom_addons"

        - step: "Apply Odoo 19.0 compatibility patches"
          files:
            - "views/res_config_settings_views.xml (line 117)"
            - "views/attachment_card_onlyoffice.xml (xpath)"
            - "controllers/controllers.py (line 179)"

        - step: "Install OnlyOffice Document Server (Docker)"
          command: "docker run -i -t -d -p 8080:80 --restart=always --name onlyoffice-documentserver onlyoffice/documentserver"

        - step: "Get JWT secret from container"
          command: "docker exec onlyoffice-documentserver cat /etc/onlyoffice/documentserver/local.json | grep -A 2 '\"secret\"'"

        - step: "Update Odoo http_interface"
          change: "http_interface = 0.0.0.0 in odoo.conf"

        - step: "Install module in Odoo"
          command: "./odoo-bin -c odoo.conf -d odoo_smb -i onlyoffice_odoo --stop-after-init"

        - step: "Configure in Odoo UI"
          location: "Settings → ONLYOFFICE"
          fields: "Fill all required fields (see odoo_configuration section)"

        - step: "Test functionality"
          action: "Upload a .docx file → Click edit icon → OnlyOffice editor should open"

      production:
        prerequisites:
          - "OnlyOffice Document Server deployed (Docker or standalone)"
          - "Domain/subdomain configured (e.g., onlyoffice.yourdomain.com)"
          - "SSL certificate installed"
          - "Firewall rules: Odoo ↔ OnlyOffice communication allowed"

        steps:
          - "Copy custom_addons/onlyoffice_odoo to production server"
          - "Apply all Odoo 19.0 compatibility patches"
          - "Install pyjwt in production venv"
          - "Update production odoo.conf: addons_path"
          - "Configure http_interface appropriately"
          - "Install module: ./odoo-bin -i onlyoffice_odoo"
          - "Restart Odoo service"
          - "Configure HTTPS URLs in Odoo settings"
          - "Test with mixed content warnings disabled"

    troubleshooting:
      "ONLYOFFICE cannot be reached":
        causes:
          - "OnlyOffice container not running"
          - "Wrong URL in settings"
          - "Network connectivity issue"
          - "Firewall blocking communication"
        solutions:
          - "docker ps | grep onlyoffice (check container status)"
          - "curl http://ONLYOFFICE_URL/healthcheck (should return 'true')"
          - "Check http_interface in odoo.conf (must allow OnlyOffice to connect back)"
          - "Verify URL is accessible from Odoo server"

      "Authorization error":
        cause: "JWT secret mismatch or missing"
        solution: "Get secret from container and enter in Odoo settings"
        command: "docker exec onlyoffice-documentserver cat /etc/onlyoffice/documentserver/local.json | grep -A 2 '\"secret\"'"

      "Error while downloading the document file":
        cause: "OnlyOffice cannot reach Odoo (callback URL wrong)"
        solution: "Set 'ONLYOFFICE Docs address for internal requests from the server' to accessible Odoo URL"
        note: "Do NOT use localhost if OnlyOffice is in Docker - use host IP or domain"

      "500 Internal Server Error when opening editor":
        cause: "Odoo 19.0 compatibility issue (controllers.py)"
        solution: "Replace validate_access() with _can_return_content()"
        file: "controllers/controllers.py line ~179"

      "Edit button not appearing on attachments":
        cause: "Odoo 19.0 mail attachment card structure changed"
        solution: "Update XPath in attachment_card_onlyoffice.xml"
        change: "o-mail-AttachmentCard-aside → o-mail-AttachmentButtons"

    structure:
      controllers: true
      models: true
      views: true
      static: true
      i18n: true
      utils: true
    drawio_plugin_research:
      sources_downloaded:
        sdkjs_examples: "/home/embed/Dev/ODOO/sdkjs-plugins-master"
        docspace_plugin: "/home/embed/Dev/ODOO/docspace-plugins-master/draw.io"
      notes:
        - "DocSpace draw.io plugin v1.2.0 uses embed.diagrams.net iframe (?proto=json&embed=1) with xml/xmlpng formats for .drawio/.png; seeds a blank mxfile and saves/exports via DocSpace REST endpoints."
        - "Document Server container currently lacks draw.io plugin directory; install from Plugin Manager/marketplace to materialize under sdkjs-plugins or cache."
        - "2025-12-17 container scan: onlyoffice-documentserver has default plugins (Photo Editor, YouTube, OCR, Translator, AI, Mendeley, Thesaurus, Highlight code, Zotero, Speech, Speech input); no draw.io manifest. drawoffice-nginx container restarting; no draw.io activity in nginx logs."
        - "User reports draw.io installed via Plugin Manager and visible in ribbon; actual plugin files not yet located in scanned container paths—verify which VM/container hosts the installed plugin and capture its GUID/path."
        - "Repeated scans (find/grep for draw.io/diagrams.net) in /var/www/onlyoffice/documentserver and /var/lib/onlyoffice/documentserver still empty; marketplace dir lacks draw.io package. Hypothesis: different DS/VM or alternative mount. Fallback: build/publish own plugin from docspace-plugins-master/draw.io or jgraph/drawio via marketplace guide."
        - "Marketplace sources tracked: https://github.com/ONLYOFFICE/onlyoffice.github.io/tree/master and Plugin Manager store assets under /store; related discussion: https://github.com/ONLYOFFICE/onlyoffice.github.io/issues/356."
      roadmap:
        goal: "Custom draw.io plugin with SVG + embedXml, preserving current UX"
        base_sources:
          - "/home/embed/Dev/ODOO/docspace-plugins-master/draw.io (v1.2.0, webpack + docspace plugin SDK)"
          - "Upstream reference: https://github.com/jgraph/drawio"
        behavior:
          - "Launch via plugin button → embed.diagrams.net iframe"
          - "Save as SVG (image/svg+xml) with embedXml=true so mxfile is stored inside SVG"
          - "Re-open by extracting mxfile from SVG; .drawio remains supported"
        deployment:
          - "Identify correct Document Server (odoo.conf ONLYOFFICE URL) and install under sdkjs-plugins/{GUID} with config.json; restart container"
        tests:
          - "DOCX unzip → word/media/image*.svg contains mxfile"
