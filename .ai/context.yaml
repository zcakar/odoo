      document_server_secret:
        current: "yinbMIHzEdFEfYYGHmCeIeJB10iwoG63"
        source: "/etc/onlyoffice/documentserver/local.json"
        updated: "2025-12-22"
        note: "Must match Odoo onlyoffice_connector.*jwt_secret parameters"
