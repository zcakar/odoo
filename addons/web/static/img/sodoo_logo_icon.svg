<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Stylized "S" with infinity symbol inspiration -->
  <path d="M 180 180 Q 140 180 140 220 Q 140 250 170 260 L 280 300 Q 320 315 320 350 Q 320 380 280 380 Q 240 380 220 360" 
        stroke="white" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.95"/>
  
  <path d="M 332 332 Q 372 332 372 292 Q 372 262 342 252 L 232 212 Q 192 197 192 162 Q 192 132 232 132 Q 272 132 292 152" 
        stroke="white" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.95"/>
  
  <!-- Modern accent dots -->
  <circle cx="380" cy="180" r="16" fill="white" opacity="0.9"/>
  <circle cx="132" cy="332" r="16" fill="white" opacity="0.9"/>
  
  <!-- Subtle geometric pattern -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="2" opacity="0.1"/>
</svg>

