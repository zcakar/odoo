      <stop offset="0%" style="stop-color:#F08705"/>
      <stop offset="100%" style="stop-color:#DF6C0C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="1" y="1" width="18" height="18" rx="3" fill="url(#dg1)"/>
  <!-- Flowchart shapes - draw.io style -->
  <rect x="3" y="4" width="5" height="3" rx="0.5" fill="white"/>
  <rect x="12" y="4" width="5" height="3" rx="0.5" fill="white"/>
  <ellipse cx="10" cy="14" rx="3" ry="2" fill="white"/>
  <!-- Connecting lines -->
  <line x1="8" y1="5.5" x2="12" y2="5.5" stroke="white" stroke-width="0.8"/>
  <line x1="5.5" y1="7" x2="5.5" y2="11" stroke="white" stroke-width="0.8"/>
  <line x1="5.5" y1="11" x2="7" y2="14" stroke="white" stroke-width="0.8"/>
  <line x1="14.5" y1="7" x2="14.5" y2="11" stroke="white" stroke-width="0.8"/>
  <line x1="14.5" y1="11" x2="13" y2="14" stroke="white" stroke-width="0.8"/>
</svg>
